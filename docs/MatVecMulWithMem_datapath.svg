<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%" style="background-color: #0b1120; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/>
    </marker>
    <marker id="arr-rose" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#fb7185"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#34d399"/>
    </marker>
    <marker id="arr-indigo" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#818cf8"/>
    </marker>
    <!-- Gradients -->
    <linearGradient id="mem-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>
    <linearGradient id="pe-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="#0b1120"/>

  <!-- Title & Header -->
  <text x="35" y="42" font-size="22" font-weight="700" fill="#f8fafc">MatVecMulWithMem (Multi-Bank Matrix-Vector Multiplier)</text>
  <text x="35" y="66" font-size="13" fill="#94a3b8">Hardware Datapath Architecture Block Diagram (Parameters: N=8, writeWidth=4, bank=16)</text>

  <!-- Main Module Boundary -->
  <rect x="25" y="85" width="1150" height="645" rx="14" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <rect x="35" y="93" width="230" height="22" rx="4" fill="#1e293b"/>
  <text x="45" y="108" font-size="12" font-weight="600" fill="#cbd5e1">Module: MatVecMulWithMem</text>

  <!-- ==================== LEFT: INPUT PORTS ==================== -->
  <!-- Clock & Reset -->
  <g transform="translate(15, 125)">
    <rect x="0" y="0" width="85" height="28" rx="5" fill="#1e293b" stroke="#64748b" stroke-width="1.2"/>
    <text x="42" y="18" font-size="11" font-weight="600" fill="#e2e8f0" text-anchor="middle">clk, reset</text>
  </g>
  <path d="M 100 139 L 160 139" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arr-blue)"/>

  <!-- memSet -->
  <g transform="translate(15, 175)">
    <rect x="0" y="0" width="95" height="28" rx="5" fill="#1e293b" stroke="#fb7185" stroke-width="1.2"/>
    <text x="47" y="18" font-size="11" font-weight="600" fill="#fecdd3" text-anchor="middle">memSet [1b]</text>
  </g>
  <path d="M 110 189 L 160 189" fill="none" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arr-rose)"/>

  <!-- matIn [31:0] -->
  <g transform="translate(15, 275)">
    <rect x="0" y="0" width="115" height="30" rx="5" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="57" y="19" font-size="11" font-weight="700" fill="#bae6fd" text-anchor="middle">matIn [31:0] (4B)</text>
  </g>

  <!-- bankSelSet & bankSelIn -->
  <g transform="translate(15, 375)">
    <rect x="0" y="0" width="105" height="28" rx="5" fill="#1e293b" stroke="#fb7185" stroke-width="1.2"/>
    <text x="52" y="18" font-size="11" font-weight="600" fill="#fecdd3" text-anchor="middle">bankSelSet [1b]</text>
  </g>
  <path d="M 120 389 L 160 389" fill="none" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arr-rose)"/>

  <g transform="translate(15, 435)">
    <rect x="0" y="0" width="115" height="28" rx="5" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="57" y="18" font-size="11" font-weight="600" fill="#bae6fd" text-anchor="middle">bankSelIn [3:0]</text>
  </g>
  <path d="M 130 449 L 160 449" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- vIn [63:0] -->
  <g transform="translate(15, 595)">
    <rect x="0" y="0" width="120" height="32" rx="5" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
    <text x="60" y="20" font-size="11" font-weight="700" fill="#ecfdf5" text-anchor="middle">vIn [63:0] (INT8x8)</text>
  </g>

  <!-- ==================== COLUMN 2: CONTROL LOGIC ==================== -->
  <!-- Write FSM & Counter -->
  <rect x="160" y="155" width="145" height="85" rx="8" fill="#1e293b" stroke="#fb7185" stroke-width="1.5"/>
  <text x="232" y="177" font-size="12" font-weight="700" fill="#fecdd3" text-anchor="middle">Write Sequencer</text>
  <line x1="170" y1="185" x2="295" y2="185" stroke="#475569" stroke-width="1"/>
  <text x="232" y="203" font-size="11" fill="#cbd5e1" text-anchor="middle">reg writing (1b)</text>
  <text x="232" y="223" font-size="11" fill="#cbd5e1" text-anchor="middle">reg writeCounter [3:0]</text>

  <!-- Bank Selector Register -->
  <rect x="160" y="370" width="145" height="95" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="232" y="392" font-size="12" font-weight="700" fill="#7dd3fc" text-anchor="middle">Bank Selection</text>
  <line x1="170" y1="400" x2="295" y2="400" stroke="#475569" stroke-width="1"/>
  <text x="232" y="420" font-size="11" fill="#cbd5e1" text-anchor="middle">reg bankSel [3:0]</text>
  <text x="232" y="445" font-size="10" fill="#94a3b8" text-anchor="middle">(Protected: !writing)</text>

  <!-- ==================== COLUMN 3: MATRIX STORAGE ==================== -->
  <!-- Route matIn [31:0] cleanly to Memory -->
  <path d="M 130 290 L 350 290" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <rect x="150" y="278" width="85" height="18" rx="3" fill="#0f172a" stroke="#0284c7" stroke-width="1"/>
  <text x="192" y="291" font-size="10" font-weight="600" fill="#38bdf8" text-anchor="middle">matIn [31:0]</text>

  <!-- Route writeCounter to Memory (Write Address) -->
  <path d="M 305 220 L 350 220" fill="none" stroke="#fb7185" stroke-width="2" marker-end="url(#arr-rose)"/>
  <text x="327" y="213" font-size="9" font-weight="600" fill="#fb7185" text-anchor="middle">wrSlice</text>

  <!-- Route bankSel to Memory (Write Bank Select) -->
  <path d="M 305 410 L 350 410" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="327" y="403" font-size="9" font-weight="600" fill="#38bdf8" text-anchor="middle">wrBank</text>

  <!-- Memory Box -->
  <g transform="translate(350, 140)">
    <rect x="0" y="0" width="190" height="340" rx="10" fill="url(#mem-grad)" stroke="#818cf8" stroke-width="2"/>
    <text x="95" y="26" font-size="13" font-weight="700" fill="#e0e7ff" text-anchor="middle">matMemBanks [15:0]</text>
    <text x="95" y="44" font-size="10" fill="#a5b4fc" text-anchor="middle">16 Banks × 512-bit (64B/Bank)</text>

    <!-- Visual Banks Representation -->
    <rect x="15" y="58" width="160" height="24" rx="4" fill="#312e81" stroke="#6366f1"/>
    <text x="95" y="74" font-size="11" font-weight="600" fill="#c7d2fe" text-anchor="middle">Bank 0 [511:0]</text>

    <rect x="15" y="90" width="160" height="24" rx="4" fill="#312e81" stroke="#6366f1"/>
    <text x="95" y="106" font-size="11" font-weight="600" fill="#c7d2fe" text-anchor="middle">Bank 1 [511:0]</text>

    <text x="95" y="133" font-size="16" fill="#818cf8" text-anchor="middle">⋮</text>

    <rect x="15" y="148" width="160" height="24" rx="4" fill="#312e81" stroke="#6366f1"/>
    <text x="95" y="164" font-size="11" font-weight="600" fill="#c7d2fe" text-anchor="middle">Bank 15 [511:0]</text>

    <!-- Write Info Badge -->
    <rect x="15" y="195" width="160" height="60" rx="6" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1"/>
    <text x="95" y="214" font-size="10" font-weight="600" fill="#c7d2fe" text-anchor="middle">Write Slicing Index:</text>
    <text x="95" y="230" font-size="10" fill="#93c5fd" text-anchor="middle">[writeCounter*32 +: 32]</text>
    <text x="95" y="246" font-size="9" fill="#94a3b8" text-anchor="middle">16 cycles × 4B = 64 Bytes</text>

    <rect x="15" y="275" width="160" height="45" rx="6" fill="#0f172a" stroke="#6366f1" stroke-width="1"/>
    <text x="95" y="293" font-size="10" font-weight="700" fill="#a5b4fc" text-anchor="middle">Distributed RAM / Regs</text>
    <text x="95" y="309" font-size="10" fill="#cbd5e1" text-anchor="middle">Total: 8,192 Flip-Flops</text>
  </g>

  <!-- ==================== COLUMN 4: READ MUX ==================== -->
  <!-- Memory to MUX wide bus -->
  <path d="M 540 300 L 575 300" fill="none" stroke="#818cf8" stroke-width="4" marker-end="url(#arr-indigo)"/>
  <rect x="545" y="271" width="28" height="16" rx="2" fill="#0f172a" stroke="#818cf8" stroke-width="1"/>
  <text x="559" y="283" font-size="8" font-weight="700" fill="#c7d2fe" text-anchor="middle">16x</text>

  <!-- 16-to-1 MUX Trapezoid -->
  <polygon points="575,200 615,230 615,370 575,400" fill="#1e293b" stroke="#818cf8" stroke-width="1.8"/>
  <text x="595" y="305" font-size="12" font-weight="700" fill="#e0e7ff" text-anchor="middle" transform="rotate(-90 595 305)">16-to-1 MUX</text>

  <!-- bankSel to MUX selector line (cleanly routed beneath memory) -->
  <path d="M 232 465 L 232 505 L 595 505 L 595 390" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arr-blue)"/>
  <rect x="360" y="495" width="150" height="20" rx="3" fill="#0f172a" stroke="#0284c7" stroke-width="1"/>
  <text x="435" y="509" font-size="10" font-weight="600" fill="#7dd3fc" text-anchor="middle">bankSel [3:0] (Read Select)</text>

  <!-- ==================== CLEAN INTER-MODULE CHANNEL (x=615 to 730) ==================== -->
  <!-- Single Pristine Horizontal Wire for matMem [511:0] -->
  <path d="M 615 300 L 730 300" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arr-blue)"/>
  <g transform="translate(640, 272)">
    <rect x="0" y="0" width="70" height="24" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="35" y="16" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">matMem</text>
  </g>
  <text x="675" y="318" font-size="9" font-weight="600" fill="#94a3b8" text-anchor="middle">[511:0]</text>

  <!-- ==================== COLUMN 5: ARITHMETIC UNIT ==================== -->
  <!-- Outer Box for MatVecProduct8Bits -->
  <rect x="730" y="115" width="340" height="555" rx="12" fill="url(#pe-grad)" stroke="#2dd4bf" stroke-width="2"/>
  <rect x="740" y="125" width="220" height="22" rx="4" fill="#134e4a"/>
  <text x="750" y="140" font-size="12" font-weight="700" fill="#ccfbf1">Submodule: MatVecProduct8Bits</text>
  <text x="900" y="165" font-size="11" fill="#5eead4" text-anchor="middle">Fully Combinational Matrix Multiply (N=8)</text>

  <!-- Internal Row Slicer for matMem inside MatVecProduct8Bits -->
  <path d="M 730 300 L 755 300" fill="none" stroke="#38bdf8" stroke-width="2"/>
  <path d="M 755 240 L 755 470" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="3,2"/>
  <path d="M 755 240 L 775 240" fill="none" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arr-blue)"/>

  <!-- Row 0 Detailed PE Box -->
  <rect x="775" y="180" width="270" height="150" rx="8" fill="#134e4a" stroke="#2dd4bf" stroke-width="1.5"/>
  <text x="788" y="202" font-size="12" font-weight="700" fill="#f0fdfa">DotProduct8Bits (Row 0)</text>

  <!-- Multiplier Block -->
  <rect x="790" y="222" width="120" height="32" rx="4" fill="#042f2e" stroke="#14b8a6"/>
  <text x="850" y="242" font-size="10" font-weight="600" fill="#99f6e4" text-anchor="middle">8× INT8 Mult (*)</text>

  <!-- Adder Tree Block -->
  <rect x="790" y="270" width="120" height="34" rx="4" fill="#042f2e" stroke="#14b8a6"/>
  <text x="850" y="287" font-size="10" font-weight="600" fill="#99f6e4" text-anchor="middle">19-bit Adder Tree (Σ)</text>
  <text x="850" y="299" font-size="8" fill="#5eead4" text-anchor="middle">16 + $clog2(8) = 19b</text>

  <path d="M 850 254 L 850 270" fill="none" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <path d="M 910 287 L 935 287" fill="none" stroke="#2dd4bf" stroke-width="2" marker-end="url(#arr-green)"/>
  <rect x="935" y="275" width="100" height="24" rx="4" fill="#042f2e" stroke="#34d399"/>
  <text x="985" y="291" font-size="10" font-weight="700" fill="#ecfdf5" text-anchor="middle">Row0 [18:0]</text>

  <!-- Row 1 Compact Box -->
  <path d="M 755 370 L 775 370" fill="none" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <rect x="775" y="348" width="270" height="44" rx="6" fill="#134e4a" stroke="#0f766e"/>
  <text x="788" y="375" font-size="11" font-weight="600" fill="#ccfbf1">DotProduct8Bits (Row 1)</text>
  <path d="M 925 370 L 945 370" fill="none" stroke="#2dd4bf" stroke-width="2" marker-end="url(#arr-green)"/>
  <rect x="945" y="359" width="90" height="22" rx="3" fill="#042f2e" stroke="#14b8a6"/>
  <text x="990" y="374" font-size="9" fill="#a7f3d0" text-anchor="middle">Row1 [37:19]</text>

  <!-- Ellipsis -->
  <text x="900" y="422" font-size="18" fill="#5eead4" text-anchor="middle">⋮</text>

  <!-- Row 7 Compact Box -->
  <path d="M 755 470 L 775 470" fill="none" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <rect x="775" y="448" width="270" height="44" rx="6" fill="#134e4a" stroke="#0f766e"/>
  <text x="788" y="475" font-size="11" font-weight="600" fill="#ccfbf1">DotProduct8Bits (Row 7)</text>
  <path d="M 925 470 L 945 470" fill="none" stroke="#2dd4bf" stroke-width="2" marker-end="url(#arr-green)"/>
  <rect x="945" y="459" width="90" height="22" rx="3" fill="#042f2e" stroke="#14b8a6"/>
  <text x="990" y="474" font-size="9" fill="#a7f3d0" text-anchor="middle">Row7 [151:133]</text>

  <!-- ==================== VECTOR INPUT vIn ROUTING ==================== -->
  <path d="M 135 611 L 1060 611 L 1060 212" fill="none" stroke="#34d399" stroke-width="2.5"/>
  <path d="M 1060 212 L 1045 212" fill="none" stroke="#34d399" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <path d="M 1060 353 L 1045 353" fill="none" stroke="#34d399" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <path d="M 1060 453 L 1045 453" fill="none" stroke="#34d399" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <circle cx="1060" cy="353" r="2.5" fill="#34d399"/>
  <circle cx="1060" cy="453" r="2.5" fill="#34d399"/>
  <text x="1060" y="202" font-size="9" fill="#a7f3d0" text-anchor="middle">vIn</text>
  <rect x="290" y="600" width="200" height="22" rx="3" fill="#0f172a" stroke="#059669" stroke-width="1"/>
  <text x="390" y="615" font-size="10" font-weight="600" fill="#6ee7b7" text-anchor="middle">vIn [63:0] (Broadcast Input)</text>

  <!-- Output Assembly Block -->
  <rect x="775" y="520" width="270" height="48" rx="6" fill="#042f2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="910" y="541" font-size="11" font-weight="700" fill="#6ee7b7" text-anchor="middle">Vector Bus Concatenation</text>
  <text x="910" y="557" font-size="9" fill="#a7f3d0" text-anchor="middle">{Row 7, ..., Row 0} = 152 bits</text>


  <!-- ==================== FINAL OUTPUT PORT ==================== -->
  <path d="M 1045 544 L 1054 544 A 6 6 0 0 1 1066 544 L 1090 544" fill="none" stroke="#34d399" stroke-width="3" marker-end="url(#arr-green)"/>
  <g transform="translate(1090, 526)">
    <rect x="0" y="0" width="80" height="36" rx="6" fill="#065f46" stroke="#34d399" stroke-width="1.8"/>
    <text x="40" y="19" font-size="12" font-weight="700" fill="#ecfdf5" text-anchor="middle">vOut</text>
    <text x="40" y="31" font-size="9" fill="#a7f3d0" text-anchor="middle">[151:0] (19bx8)</text>
  </g>

  <!-- ==================== BOTTOM LEGEND ==================== -->
  <g transform="translate(50, 695)">
    <line x1="0" y1="10" x2="25" y2="10" stroke="#38bdf8" stroke-width="2.5"/>
    <text x="32" y="14" font-size="11" fill="#94a3b8">Matrix Data Bus</text>

    <line x1="150" y1="10" x2="175" y2="10" stroke="#34d399" stroke-width="2.5"/>
    <text x="182" y="14" font-size="11" fill="#94a3b8">Vector Data Bus</text>

    <line x1="300" y1="10" x2="325" y2="10" stroke="#fb7185" stroke-width="1.8"/>
    <text x="332" y="14" font-size="11" fill="#94a3b8">Control &amp; FSM</text>

    <line x1="435" y1="10" x2="460" y2="10" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,2"/>
    <text x="467" y="14" font-size="11" fill="#94a3b8">Address Line</text>

    <rect x="575" y="3" width="14" height="14" rx="2" fill="#312e81" stroke="#818cf8"/>
    <text x="596" y="14" font-size="11" fill="#94a3b8">Memory Bank Array</text>

    <rect x="740" y="3" width="14" height="14" rx="2" fill="#134e4a" stroke="#2dd4bf"/>
    <text x="761" y="14" font-size="11" fill="#94a3b8">Combinational PE</text>
  </g>
</svg>
