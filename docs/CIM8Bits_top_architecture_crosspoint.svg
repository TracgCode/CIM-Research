  </g>
  <text x="450" y="918" font-size="10" fill="#64748b">Example state shown: Out 0 fans out to In 1 and In 3, Out 1 → In 2, Out 3 → In 0. Closing X(row, col) connects Out col to In row. At most one crosspoint per row may be ON (one driver per In wire); a column may fan out to many rows.</text>
