  <text x="182" y="711" font-size="11" font-weight="700" fill="#cbd5e1" text-anchor="middle">Example program</text>
  <line x1="45" y1="719" x2="320" y2="719" stroke="#475569"/>
  <g font-family="Menlo, Consolas, monospace" font-size="10" fill="#cbd5e1">
    <text x="47" y="739">MATVEC T0, bank 3</text>
    <text x="47" y="759">RELU   T0</text>
    <text x="47" y="779">ROUTE  X(1,0)=ON   ; T0 → T1</text>
    <text x="47" y="799">ROUTE  X(3,0)=ON   ; T0 → T3</text>
    <text x="47" y="819">SEND   T0</text>
    <text x="47" y="839">MATVEC T1, bank 0</text>
    <text x="47" y="859">SYNC</text>
  </g>

