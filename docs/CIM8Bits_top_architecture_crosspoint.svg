  <rect width="1560" height="1000" fill="#0b1120"/>
  <text x="35" y="42" font-size="22" font-weight="700" fill="#f8fafc">CIM8Bits Top-Level, Version C (Crosspoint Switch Matrix: Out Reg Columns × In Reg Rows)</text>
  <text x="35" y="66" font-size="13" fill="#94a3b8">Each Out Reg drives a vertical wire, each In Reg listens on a horizontal wire; a programmable switch sits at every crossing (4 tiles shown, N=8, 8N = 64 bit)</text>
